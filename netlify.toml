[build]
  command = "npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Local dev doesn't use `netlify dev` (its redirect proxy interferes with
# Vite's own asset serving in this repo's nested frontend/ + root
# netlify/functions/ layout). Instead: `npm run dev` (Vite, port 5195) +
# `npm run functions:serve` (root, port 9999) with Vite's dev proxy
# forwarding /api/* to the functions server — see frontend/vite.config.js.
# This [[redirects]] config is what production actually uses.

# API routes go to Netlify Functions (functions declare their own
# `path` in `config`, e.g. /api/health -> health.js).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — client-side routing (React Router) for everything else,
# but the public quote page and app routes are all handled by the same
# single-page app, so this must come after the /api/* redirect above.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
